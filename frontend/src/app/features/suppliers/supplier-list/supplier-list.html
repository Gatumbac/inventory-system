<div class="header">
  <h2>Proveedores</h2>
  @if (isAdmin) {
    <a mat-flat-button routerLink="/suppliers/new">Nuevo proveedor</a>
  }
</div>

<div class="search">
  <mat-form-field appearance="outline">
    <mat-label>Buscar por nombre</mat-label>
    <input matInput #searchInput (keyup.enter)="onSearch(searchInput.value)" />
  </mat-form-field>
  <button mat-flat-button (click)="onSearch(searchInput.value)">Buscar</button>
</div>

<div class="table-container">
  <table mat-table [dataSource]="suppliers()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let supplier">{{ supplier.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let supplier">
        <a mat-button [routerLink]="['/suppliers', supplier.id, 'edit']">Editar</a>
        <button mat-button (click)="remove(supplier)">Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

@if (!loading() && totalCount() === 0) {
  <p class="empty">No hay proveedores</p>
}

<mat-paginator
  [length]="totalCount()"
  [pageSize]="pageSize()"
  [pageIndex]="page() - 1"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPage($event)"
/>
