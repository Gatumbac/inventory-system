<h2>Productos</h2>

<div class="table-container">
  <table mat-table [dataSource]="products()">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let product">{{ product.code }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let product">{{ product.description }}</td>
    </ng-container>

    <ng-container matColumnDef="attributes">
      <th mat-header-cell *matHeaderCellDef>Atributos</th>
      <td mat-cell *matCellDef="let product">
        @for (attribute of product.attributes; track attribute.name) {
          <div>{{ attribute.name }}: {{ attribute.value }}</div>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

@if (!loading() && products().length === 0) {
  <p class="empty">No hay productos</p>
}
