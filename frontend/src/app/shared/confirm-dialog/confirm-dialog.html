<h2 mat-dialog-title>{{ options.title }}</h2>
<mat-dialog-content>{{ options.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancelar</button>
  <button mat-flat-button [class.destructive]="options.destructive" [mat-dialog-close]="true">
    {{ options.confirmLabel ?? 'Confirmar' }}
  </button>
</mat-dialog-actions>
